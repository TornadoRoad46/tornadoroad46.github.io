    <!-- Additional styles for video size, gap, footer, fullscreen image -->
    <style>
        /* Video wrapper with 16:9 aspect ratio (original size) */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            background: #000;
            /* Add gap between videos */
            margin: 8px;
            box-sizing: border-box;
        }
        /* Compensate for margin on pure-g */
        .pure-g {
            margin: -8px; /* pulls back the outer margin so edges align */
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Footer fixed at bottom with original yellow */
        #colophon {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ffcc00; /* cars-vs-trains yellow */
            color: #000;
            text-align: center;
            padding: 12px 0;
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 16px;
            z-index: 1000;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.2);
        }
        /* Ensure content doesn't hide behind footer */
        body {
            margin-bottom: 60px; /* match footer height */
        }
        /* Hidden visitor badge */
        .visitor-badge-hidden {
            display: none;
        }

        /* Fullscreen image for "No" button - covers entire viewport exactly */
        #fullscreen-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black url('https://static1.e926.net/data/84/13/8413d473460f12aca578733224732579.jpg') no-repeat center center;
            background-size: cover;
            z-index: 10000;
            display: none;
        }
    </style>
