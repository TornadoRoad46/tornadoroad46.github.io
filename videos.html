<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cars Vs Trains – Videos</title>
    <link rel="stylesheet" href="https://web.archive.org/web/20181227184606/http://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://web.archive.org/web/20181227184606/http://fonts.googleapis.com/css?family=Roboto:400,300,500,700">
    <link rel="stylesheet" href="https://web.archive.org/web/20181227184606/https://fonts.googleapis.com/css?family=Roboto+Condensed:400,700">
    <link rel="stylesheet" href="https://web.archive.org/web/20181227184606/http://yui.yahooapis.com/pure/0.6.0/pure-min.css">
    <link rel="stylesheet" href="https://web.archive.org/web/20181227184606/http://yui.yahooapis.com/pure/0.6.0/grids-responsive-min.css">
    <link rel="stylesheet" href="https://web.archive.org/web/20181227184606/http://www.carsvstrains.com/wp-content/themes/carsvstrains/build/styles/style.css">
    <style>
        /* Glassy video tiles with equal gaps */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            background: rgba(255,255,255,0.05);
            margin: 15px; /* equal gap in all directions */
            box-sizing: border-box;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .video-wrapper:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 25px rgba(255,255,255,0.15);
            border-color: rgba(255,204,0,0.5);
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 15px;
        }
        /* Remove negative margin from pure-g */
        .pure-g {
            margin: 0;
        }
        /* Ensure l-box doesn't add extra padding */
        .l-box {
            padding: 0;
        }
        /* Header (optional) */
        .header--content .header {
            visibility: visible !important;
            margin-bottom: 20px;
        }
        /* Footer */
        #colophon {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ffcc00;
            color: #000;
            text-align: center;
            padding: 12px 0;
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 16px;
            z-index: 1000;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.2);
        }
        body {
            margin-bottom: 60px;
            background: #1a1a1a;
        }
        /* Hidden visitor badge */
        .visitor-badge-hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="header--content">
        <header class="header">
            <img class="title" src="/CvT-header-transparent.png" alt="Cars Vs Trains">
        </header>
    </div>

    <div id="content" class="site-content">
        <div id="primary" class="content-area">
            <main id="main" class="site-main">
                <div class="pure-g">
                    <!-- All 9 videos -->
                    <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3"><div class="l-box video-wrapper"><iframe src="https://www.youtube.com/embed/iEA1rLpbedU" allowfullscreen></iframe></div></div>
                    <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3"><div class="l-box video-wrapper"><iframe src="https://www.youtube.com/embed/frP4kb616G4" allowfullscreen></iframe></div></div>
                    <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3"><div class="l-box video-wrapper"><iframe src="https://www.youtube.com/embed/fZ8GdGLm_qw" allowfullscreen></iframe></div></div>
                    <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3"><div class="l-box video-wrapper"><iframe src="https://www.youtube.com/embed/biu8U4MUGWE" allowfullscreen></iframe></div></div>
                    <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3"><div class="l-box video-wrapper"><iframe src="https://www.youtube.com/embed/T8BdcFa4x80" allowfullscreen></iframe></div></div>
                    <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3"><div class="l-box video-wrapper"><iframe src="https://www.youtube.com/embed/BGXHTrFNwYo" allowfullscreen></iframe></div></div>
                    <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3"><div class="l-box video-wrapper"><iframe src="https://www.youtube.com/embed/XoaOz6FsVPk" allowfullscreen></iframe></div></div>
                    <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3"><div class="l-box video-wrapper"><iframe src="https://www.youtube.com/embed/0sxg-lYABXo" allowfullscreen></iframe></div></div>
                    <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3"><div class="l-box video-wrapper"><iframe src="https://www.youtube.com/embed/_c28oIaGUkA" allowfullscreen></iframe></div></div>
                </div>
            </main>
        </div>
    </div>

    <footer id="colophon">
        <div>Website recreation</div>
        <!-- Hidden visitor counter -->
        <img src="https://api.visitorbadge.io/api/visitors?path=carsvstrains.com&countColor=%23263759" style="display:none;" alt="visitor counter">
    </footer>
</body>
</html>
