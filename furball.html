<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>furries vs trains</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #fullscreen-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black url('notafurry.jpg') no-repeat center center;
            background-size: auto 100%; /* height exactly 100%, width auto – touches top/bottom only */
            cursor: pointer;
        }
        /* Small back button */
        .back-link {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 5px;
            text-decoration: none;
            font-family: sans-serif;
            z-index: 10001;
        }
        .back-link:hover {
            background: rgba(255,204,0,0.8);
            color: black;
        }
    </style>
</head>
<body>
    <div id="fullscreen-image" onclick="window.location.href='/';"></div>
    <a href="/" class="back-link">← Back to Age Verification</a>
</body>
</html>
