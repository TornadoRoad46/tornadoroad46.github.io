<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cars Vs Trains</title>
  <!-- original styles (loaded from archive.org to keep the exact look) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,300,500,700|Roboto+Condensed:400,700">
  <link rel="stylesheet" href="https://web.archive.org/web/20180110105847/http://www.carsvstrains.com/wp-content/themes/carsvstrains/build/styles/style.css">
  <!-- base reset: black background, no overflow -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      height: 100vh;
      overflow: hidden;
      font-family: 'Roboto', sans-serif;
    }
    /* both layers fill the screen */
    .screen-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      transition: opacity 0.25s ease;
    }
    #entry-overlay {
      visibility: visible;
      opacity: 1;
      z-index: 20;
      background: black; /* ensures overlay covers content */
    }
    #entry-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #main-content {
      visibility: hidden;
      opacity: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: black;
    }
    #main-content.visible {
      visibility: visible;
      opacity: 1;
    }
    /* center the image & badge */
    .main-image {
      max-width: 90%;
      max-height: 80vh;
      object-fit: contain;
      border: 2px solid #222;
      border-radius: 8px;
    }
    .badge {
      margin-top: 25px;
      display: inline-block;
    }
    /* small hint (can be deleted) */
    .hint {
      color: #444;
      font-size: 0.85rem;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- ORIGINAL AGE GATE (exact structure, stripped of social icons & scripts) -->
  <div id="entry-overlay" class="screen-layer">
    <div class="entry--wrapper">
      <header class="header">
        <!-- original logo from archive -->
        <img class="title" src="https://web.archive.org/web/20180110105847im_/http://www.carsvstrains.com/wp-content/themes/carsvstrains/build/images/CvT-header-transparent.png" alt="[Cars vs Trains]">
        <h1>ARE YOU AT LEAST 18 YEARS OF AGE?</h1>
        <div class="age--buttons__wrap">
          <!-- static buttons: both trigger showMainContent(), no redirects, no analytics -->
          <a href="javascript:void(0)" onclick="showMainContent(); return false;">Yes, I Am</a>
          <a href="javascript:void(0)" onclick="showMainContent(); return false;">No, I'm Not</a>
        </div>
        <hr>
        <p class="age--notice">
          <span class="notice--yellow">NOTICE:</span> The following are real videos.<br>
          You don’t ever want to get hit by a train.
        </p>
      </header>
      <!-- bottom icons (facebook/twitter/mail) removed as requested -->
    </div>
  </div>

  <!-- YOUR MAIN CONTENT (what you want to show after button click) -->
  <div id="main-content" class="screen-layer">
    <img class="main-image" src="https://static1.e926.net/data/84/13/8413d473460f12aca578733224732579.jpg" alt="furries vs trains">
    <a class="badge" href="https://visitorbadge.io/status?path=carsvstrains.com">
      <img src="https://api.visitorbadge.io/api/visitors?path=carsvstrains.com&countColor=%23263759" alt="visitor counter">
    </a>
    <!-- optional tiny hint (you can delete this line) -->
    <div class="hint">(age gate passed – enjoy)</div>
  </div>

  <!-- single function to swap layers -->
  <script>
    function showMainContent() {
      document.getElementById('entry-overlay').classList.add('hidden');
      document.getElementById('main-content').classList.add('visible');
    }
  </script>

  <!-- everything else (analytics, social widgets, email forms, extra scripts) removed -->
</body>
</html>
