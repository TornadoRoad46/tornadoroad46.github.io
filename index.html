    <style>
        /* ---------- GLOBAL RESET / PAGE RULES ---------- */
        body {
            margin: 0;
            background: #000;  /* base black (age gate & furball) */
            font-family: 'Roboto', sans-serif;
        }

        /* all pages are hidden by default, shown via JS */
        .page {
            display: none;
        }

        /* ---------- AGE GATE (crisp black, NO glass) ---------- */
        #age-gate {
            background: black;          /* solid black background */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        #age-gate .entry--wrapper {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        /* header box – solid, no glass, no blur, no nonsense */
        #age-gate .header {
            background: #0a0a0a;         /* deep black/gray solid */
            border: 2px solid #ffcc00;    /* original yellow touch */
            border-radius: 24px;
            padding: 2rem 2rem 2.5rem;
            text-align: center;
            color: white;
            box-shadow: 0 10px 30px rgba(255,204,0,0.2); /* just a glow, not glass */
        }

        #age-gate .title {
            max-width: 280px;
            margin: 0 auto 1.5rem;
            display: block;
        }

        #age-gate h1 {
            font-size: 2.2rem;
            font-weight: 700;
            font-family: 'Roboto Condensed', sans-serif;
            color: #ffcc00;
            margin: 0.5rem 0 1.8rem;
            letter-spacing: 1px;
            text-shadow: 0 2px 0 #b37400;
        }

        .age--buttons__wrap {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin: 2rem 0 1.5rem;
        }

        .age--buttons__wrap a {
            background: #ffcc00;
            color: black;
            font-weight: bold;
            font-size: 1.5rem;
            padding: 0.75rem 2.5rem;
            border-radius: 60px;
            text-decoration: none;
            font-family: 'Roboto Condensed', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid #d9b000;
            transition: 0.15s;
            box-shadow: 0 4px 0 #997a00;
        }

        .age--buttons__wrap a:hover {
            background: #ffdd44;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #997a00;
        }

        .age--notice {
            font-size: 1.1rem;
            background: #111;
            padding: 0.8rem;
            border-radius: 40px;
            border-left: 6px solid #ffcc00;
            color: #ddd;
            max-width: 500px;
            margin: 1.5rem auto 0;
        }
        .notice--yellow {
            color: #ffcc00;
            font-weight: bold;
        }

        /* ---------- VIDEOS PAGE (grid with spacing) ---------- */
        #videos-page {
            background: #111; /* dark but not pure black to differentiate */
            padding: 20px 20px 80px; /* bottom space for footer */
        }

        /* header logo on video page */
        #videos-page .header--content .header {
            text-align: center;
            padding: 20px 0 10px;
            background: transparent;
        }
        #videos-page .header--content img.title {
            max-width: 320px;
        }

        /* VIDEO GRID – non‑touching cells */
        .pure-g {
            margin: -16px;  /* compensate outer gap, creates 16px around each box */
        }
        .l-box.video-wrapper {
            margin: 16px;           /* forces gap on all four sides → videos never touch */
            padding: 0;
            background: #1a1a1a;     /* fallback */
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #333;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            transition: 0.2s;
        }
        .l-box.video-wrapper:hover {
            border-color: #ffcc00;
            transform: scale(1.01);
            box-shadow: 0 15px 30px gold;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* footer (only on video page) */
        #colophon {
            background-color: #ffcc00;
            color: black;
            text-align: center;
            padding: 15px 0;
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 16px;
            width: 100%;
            margin-top: 40px;
            border-top: 3px solid #b69400;
        }
        /* visitor badge hidden (as before) but container visible */
        #colophon img {
            display: none;
        }

        /* ---------- FURBALL PAGE (e926 fullscreen, touches top/bottom only) ---------- */
        #furball-page {
            width: 100vw;
            height: 100vh;
            background: black; /* pure black edges */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #furball-image {
            width: 100%;
            height: 100%;
            background: black url('https://static1.e926.net/data/84/13/8413d473460f12aca578733224732579.jpg') no-repeat center;
            background-size: auto 100%;   /* height fits viewport, width auto → touches top/bottom, sides cropped */
            cursor: pointer;
            transition: opacity 0.1s;
            box-shadow: none;
            border: none;
        }

        /* optional small back link (non intrusive) */
        .back-home {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #ffcc00;
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #ffcc00;
            z-index: 9999;
            font-size: 0.9rem;
        }
        .back-home:hover {
            background: #ffcc00;
            color: black;
        }

    <!-- Simple routing JS : show correct page based on path -->
    <script>
        (function() {
            // get path, default to '/' if empty
            let path = window.location.pathname;
            if (path.endsWith('/')) path = path.slice(0, -1); // remove trailing slash for matching
            if (path === '') path = '/';

            // hide all pages
            document.getElementById('age-gate').style.display = 'none';
            document.getElementById('videos-page').style.display = 'none';
            document.getElementById('furball-page').style.display = 'none';

            // show matching page
            if (path === '/videos') {
                document.getElementById('videos-page').style.display = 'block';
            } else if (path === '/furball') {
                document.getElementById('furball-page').style.display = 'block';
            } else {  // default: root or anything else → age gate
                document.getElementById('age-gate').style.display = 'flex';  // age gate uses flex
                // if unknown path like /anything, optionally rewrite to root (but keep showing age)
                if (path !== '/' && path !== '') {
                    // optional: replaceState to '/' for cleaner url? we'll just show age.
                    // but keep URL as is – user can still click yes/no
                }
            }

            // extra: if we are on furball, clicking image goes back to home
            const furImg = document.getElementById('furball-image');
            if (furImg) {
                furImg.addEventListener('click', function() {
                    window.location.href = '/';
                });
            }

            // make sure all links with href="/videos" etc behave normally (already does)
            // but we want to ensure that clicking yes/no does NOT just reload with same html?
            // they work as normal links, our routing will catch the new path.
        })();

        // bonus: dynamic handling for future pushstate? not needed, simple links are fine.
        // but we want to keep age gate background black, no glass – already done via CSS.
    </script>

    <!-- ensure that the logo placeholder works if missing -->
    <script>
        (function fixLogo() {
            // if the transparent header doesn't exist, the onerror will set placeholder.
            // but we can also add a fallback for all .title images.
            const imgs = document.querySelectorAll('img.title');
            imgs.forEach(img => {
                if (!img.complete || img.naturalHeight === 0) {
                    img.src = 'https://via.placeholder.com/300x80?text=CARS+vs+TRAINS';
                }
            });
        })();
