<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cars Vs Trains</title>
    <style>
        /* ===== RESET / BASE (from original style.css) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Helvetica, Geneva, sans-serif;
            font-weight: 400;
            font-size: 17px;
            line-height: 1.5;
        }

        a {
            text-decoration: none;
        }

        /* ===== AGE GATE OVERLAY ===== */
        #ageGate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .gate-content {
            max-width: 800px;
            width: 100%;
        }

        .gate-content .logo {
            max-width: 500px;
            width: 100%;
            margin: 0 auto 40px;
            display: block;
        }

        .gate-content h1 {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: clamp(2rem, 8vw, 4rem);
            letter-spacing: 0.03em;
            margin-bottom: 40px;
            color: #fff;
        }

        .age-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 70px;
        }

        .age-buttons a {
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 700;
            color: #FFC939;
            font-size: 1.2rem;
            padding: 15px 40px;
            border: 6px solid #FFC939;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: 0.3s;
            display: inline-block;
        }

        .age-buttons a:hover {
            background: #FFC939;
            color: #000;
        }

        .gate-content hr {
            max-width: 700px;
            margin: 0 auto 30px;
            border: 1px solid #333;
        }

        .notice {
            text-align: center;
            font-size: 1.7rem;
            line-height: 1.5;
            font-family: 'Roboto Condensed', sans-serif;
        }

        .notice-yellow {
            color: #FFC939;
            font-weight: bold;
        }

        /* ===== MAIN SITE CONTENT ===== */
        #mainContent {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        .site-header {
            padding: 40px 20px 20px;
            text-align: center;
        }

        .site-header .logo {
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            display: block;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 10px;
            margin: 30px 0;
        }

        .video-item {
            position: relative;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .video-item iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .site-footer {
            background: #FFC939;
            color: #000;
            text-align: center;
            padding: 20px;
            font-size: 16px;
        }

        /* Fallback fonts */
        @import url('https://fonts.googleapis.com/css?family=Roboto+Condensed:400,700');
    </style>
</head>
<body>

    <!-- AGE GATE -->
    <div id="ageGate">
        <div class="gate-content">
            <img class="logo" src="CvT-header-transparent.png" alt="Cars vs Trains">
            <h1>ARE YOU AT LEAST 18 YEARS OF AGE?</h1>
            <div class="age-buttons">
                <a href="#" id="yesBtn">Yes, I Am</a>
                <a href="#" id="noBtn">No, I'm Not</a>
            </div>
            <hr>
            <p class="notice">
                <span class="notice-yellow">NOTICE:</span> The following are real videos.<br>
                You don’t ever want to get hit by a train.
            </p>
        </div>
    </div>

    <!-- MAIN CONTENT (hidden until age verified) -->
    <div id="mainContent" style="display: none;">
        <header class="site-header">
            <img class="logo" src="CvT-header-transparent.png" alt="Cars vs Trains">
        </header>

        <main class="video-grid">
            <div class="video-item"><iframe src="https://www.youtube.com/embed/iEA1rLpbedU" allowfullscreen></iframe></div>
            <div class="video-item"><iframe src="https://www.youtube.com/embed/frP4kb616G4" allowfullscreen></iframe></div>
            <div class="video-item"><iframe src="https://www.youtube.com/embed/fZ8GdGLm_qw" allowfullscreen></iframe></div>
            <div class="video-item"><iframe src="https://www.youtube.com/embed/biu8U4MUGWE" allowfullscreen></iframe></div>
            <div class="video-item"><iframe src="https://www.youtube.com/embed/T8BdcFa4x80" allowfullscreen></iframe></div>
            <div class="video-item"><iframe src="https://www.youtube.com/embed/BGXHTrFNwYo" allowfullscreen></iframe></div>
            <div class="video-item"><iframe src="https://www.youtube.com/embed/XoaOz6FsVPk" allowfullscreen></iframe></div>
            <div class="video-item"><iframe src="https://www.youtube.com/embed/0sxg-lYABXo" allowfullscreen></iframe></div>
            <div class="video-item"><iframe src="https://www.youtube.com/embed/_c28oIaGUkA" allowfullscreen></iframe></div>
        </main>

        <footer class="site-footer">
            Website is recreated and for educational purposes
        </footer>
    </div>

    <script>
        (function() {
            const ageGate = document.getElementById('ageGate');
            const mainContent = document.getElementById('mainContent');
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');

            // Check if already verified
            if (localStorage.getItem('ageVerified') === 'true') {
                ageGate.style.display = 'none';
                mainContent.style.display = 'block';
            } else {
                ageGate.style.display = 'flex';   // show gate
                mainContent.style.display = 'none';
            }

            // Yes: set localStorage and show content
            yesBtn.addEventListener('click', function(e) {
                e.preventDefault();
                localStorage.setItem('ageVerified', 'true');
                ageGate.style.display = 'none';
                mainContent.style.display = 'block';
            });

            // No: redirect to Google (or any safe page)
            noBtn.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'https://www.google.com';
            });
        })();
    </script>
</body>
</html>
