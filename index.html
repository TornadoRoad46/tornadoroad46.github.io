<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cars Vs Trains</title>

    <!-- External stylesheets (cleaned from archive.org) -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,300,500,700">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto+Condensed:400,700">
    <link rel="stylesheet" href="https://yui.yahooapis.com/pure/0.6.0/pure-min.css">
    <link rel="stylesheet" href="https://yui.yahooapis.com/pure/0.6.0/grids-responsive-min.css">
    <!-- Main theme styles (your local style.css) -->
    <link rel="stylesheet" href="style.css">

    <!-- Additional styles for the simplified video grid and initial visibility -->
    <style>
        /* Hide main content initially, show only age gate */
        #content, .header--content {
            display: none;
        }
        #entry-overlay {
            display: block;
        }
        /* Video grid styling */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 20px;
        }
        .video-grid iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
        }
        /* Responsive: 2 columns on tablets, 1 on phones */
        @media (max-width: 768px) {
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 480px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
        }
        /* Keep footer styling */
        footer .icons a {
            color: #000;
        }
    </style>
</head>
<body>

<div id="page" class="site">

    <!-- AGE GATE OVERLAY -->
    <div id="entry-overlay">
        <div class="entry--wrapper">
            <header class="header">
                <!-- Logo – now pointing to your local file -->
                <img class="title" src="CvT-header-transparent.png" alt="[Cars vs Trains]">
                <h1>ARE YOU AT LEAST 18 YEARS OF AGE?</h1>
                <div class="age--buttons__wrap">
                    <!-- Yes button: hides overlay and shows main content -->
                    <a href="#" id="enterSiteBtn">Yes, I Am</a>
                    <!-- No button: stays on age gate (does nothing) -->
                    <a href="#" id="noThanksBtn">No, I'm Not</a>
                </div>
                <hr>
                <p class="age--notice">
                    <span class="notice--yellow">NOTICE:</span> The following are real videos.<br>
                    You don’t ever want to get hit by a train.
                </p>
            </header>
            <div class="bottom">
                <div class="icons">
                    <a href="https://www.facebook.com/share.php?u=http://carsvstrains.com&title=Cars%20Vs%20Trains" target="_blank"><i class="fa fa-facebook"></i></a>
                    <a href="https://twitter.com/intent/tweet?status=Cars%20Vs%20Trains+http://carsvstrains.com" target="_blank"><i class="fa fa-twitter"></i></a>
                    <a href="mailto:?subject=Cars%20Vs%20Trains&body=Check%20out%20the%20videos%20at%20http://carsvstrains.com" target="_blank"><i class="fa fa-envelope"></i></a>
                </div>
            </div>
        </div>
    </div>

    <!-- HEADER (hidden until age gate passed) -->
    <div class="header--content">
        <header class="header">
            <img class="title" src="CvT-header-transparent.png" alt="[Cars vs Trains]">
            <div class="icons">
                <span class="sharepage">Share this page:</span>
                <a href="https://www.facebook.com/share.php?u=http://carsvstrains.com&title=Cars%20Vs%20Trains" target="_blank"><i class="fa fa-facebook"></i></a>
                <a href="https://twitter.com/intent/tweet?status=Cars%20Vs%20Trains+http://carsvstrains.com" target="_blank"><i class="fa fa-twitter"></i></a>
                <a href="mailto:?subject=Cars%20Vs%20Trains&body=Check%20out%20the%20videos%20at%20http://carsvstrains.com" target="_blank"><i class="fa fa-envelope"></i></a>
            </div>
        </header>
    </div>

    <!-- MAIN CONTENT (hidden until age gate passed) -->
    <div id="content" class="site-content">
        <h2 style="text-align: center; color: #FFC939;">Cars Vs Trains</h2>
        <div class="video-grid">
            <iframe src="https://www.youtube.com/embed/iEA1rLpbedU" allowfullscreen></iframe>
            <iframe src="https://www.youtube.com/embed/frP4kb616G4" allowfullscreen></iframe>
            <iframe src="https://www.youtube.com/embed/fZ8GdGLm_qw" allowfullscreen></iframe>
            <iframe src="https://www.youtube.com/embed/biu8U4MUGWE" allowfullscreen></iframe>
            <iframe src="https://www.youtube.com/embed/T8BdcFa4x80" allowfullscreen></iframe>
            <iframe src="https://www.youtube.com/embed/BGXHTrFNwYo" allowfullscreen></iframe>
            <iframe src="https://www.youtube.com/embed/XoaOz6FsVPk" allowfullscreen></iframe>
            <iframe src="https://www.youtube.com/embed/0sxg-lYABXo" allowfullscreen></iframe>
            <iframe src="https://www.youtube.com/embed/_c28oIaGUkA" allowfullscreen></iframe>
        </div>
    </div>

    <!-- FOOTER (hidden initially, same as main content) -->
    <footer id="colophon" class="site-footer" role="contentinfo">
        <div class="container">
            <div id="emailer" class="position">
                <div class="icons followus">
                    <span>Follow us:</span>
                    <a href="https://www.facebook.com/carsvstrains/?fref=ts" target="_blank"><i class="fa fa-facebook"></i></a>
                    <a href="https://twitter.com/carsvstrains" target="_blank"><i class="fa fa-twitter"></i></a>
                </div>
                <!-- Email subscription removed for simplicity – just icons remain -->
            </div>
        </div>
    </footer>
</div>

<!-- Simple age gate script -->
<script>
    document.getElementById('enterSiteBtn').addEventListener('click', function(e) {
        e.preventDefault();
        // Hide age gate
        document.getElementById('entry-overlay').style.display = 'none';
        // Show header and main content
        document.querySelector('.header--content').style.display = 'block';
        document.getElementById('content').style.display = 'block';
        // Footer is part of normal flow – it becomes visible automatically
    });

    document.getElementById('noThanksBtn').addEventListener('click', function(e) {
        e.preventDefault();
        // Optional: redirect to a safe page, or just stay on age gate
        alert('You must be 18 or older to enter.');
    });
</script>

<!-- Remove all old tracking, archive.org scripts, and unused popup markup -->
</body>
</html>
