<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>furries vs trains</title>
  <!-- original fonts (optional, for closer match) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,300,500,700|Roboto+Condensed:400,700">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: black;
      font-family: 'Roboto', sans-serif;
      color: white;
      height: 100vh;
      overflow: hidden;              /* no scroll, like original overlay */
    }

    /* both screens use full viewport flex centering */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.2s ease;
    }

    /* age gate visible by default */
    #age-gate {
      opacity: 1;
      visibility: visible;
      background: black;            /* ensures black behind */
      z-index: 10;
    }

    /* main content hidden initially */
    #main-content {
      opacity: 0;
      visibility: hidden;
      background: black;
      z-index: 5;
    }

    /* fade transition when switching */
    .screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .screen.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* --- age gate layout (inspired by original) --- */
    .gate-container {
      max-width: 800px;
      width: 90%;
      text-align: center;
      padding: 20px;
    }

    /* logo – original image via archive.org (with fallback) */
    .logo-img {
      max-width: 100%;
      height: auto;
      margin-bottom: 20px;
    }
    .logo-fallback {
      display: none;
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffd966;               /* warm yellow tone */
      text-transform: uppercase;
      margin-bottom: 20px;
      text-shadow: 2px 2px 0 #b87c00;
    }
    .gate-container h1 {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 2.2rem;
      font-weight: 400;
      margin: 30px 0 20px;
      color: white;
      letter-spacing: 2px;
    }

    .age-buttons {
      display: flex;
      gap: 30px;
      justify-content: center;
      margin: 30px 0 20px;
      flex-wrap: wrap;
    }

    .age-buttons a {
      font-family: 'Roboto Condensed', sans-serif;
      background: #f0b71c;           /* original button yellow */
      color: black;
      font-weight: 700;
      font-size: 1.8rem;
      padding: 15px 40px;
      text-decoration: none;
      border-radius: 50px;           /* pill shape */
      box-shadow: 0 4px 0 #a07900;
      transition: 0.1s ease;
      letter-spacing: 1px;
      border: none;
      cursor: pointer;
      min-width: 200px;
    }
    .age-buttons a:hover {
      background: #ffcc33;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #a07900;
    }
    .age-buttons a:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #a07900;
    }

    hr {
      border: 1px solid #333;
      margin: 30px auto;
      width: 80%;
    }

    .age-notice {
      font-size: 1.3rem;
      font-weight: 300;
      color: #ddd;
      margin-top: 20px;
    }
    .notice--yellow {
      color: #f0b71c;
      font-weight: 700;
    }

    /* --- main content (your current website) --- */
    .main-image {
      max-width: 100%;
      max-height: 80vh;              /* keep within view */
      object-fit: contain;
      border: 2px solid #222;
      border-radius: 8px;
    }

    .badge {
      margin-top: 25px;
      display: inline-block;
    }

    /* optional small instruction (can be removed) */
    .hint {
      color: #666;
      margin-top: 20px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- AGE GATE SCREEN (original style, stripped down) -->
  <div id="age-gate" class="screen visible">
    <div class="gate-container">
      <!-- original logo (attempt to load from archive, fallback to text) -->
      <img class="logo-img" 
           src="https://web.archive.org/web/20180110105847im_/http://www.carsvstrains.com/wp-content/themes/carsvstrains/build/images/CvT-header-transparent.png" 
           alt="Cars vs Trains"
           onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='block';">
      <div class="logo-fallback">CARS VS TRAINS</div>

      <h1>ARE YOU AT LEAST 18 YEARS OF AGE?</h1>

      <div class="age-buttons">
        <!-- Both buttons trigger the same action: hide age gate, show main image -->
        <a href="#" onclick="showMainContent(); return false;">Yes, I Am</a>
        <a href="#" onclick="showMainContent(); return false;">No, I'm Not</a>
      </div>

      <hr>

      <p class="age-notice">
        <span class="notice--yellow">NOTICE:</span> The following are real videos.<br>
        You don’t ever want to get hit by a train.
      </p>
    </div>
  </div>

  <!-- MAIN CONTENT SCREEN (your current furries image + visitor badge) -->
  <div id="main-content" class="screen hidden">
    <img class="main-image" src="https://static1.e926.net/data/84/13/8413d473460f12aca578733224732579.jpg" alt="furries vs trains">

    <a class="badge" href="https://visitorbadge.io/status?path=carsvstrains.com">
      <img src="https://api.visitorbadge.io/api/visitors?path=carsvstrains.com&countColor=%23263759" alt="visitor counter">
    </a>

    <div class="hint">(you clicked the button – enjoy)</div>
  </div>

  <script>
    // Simple function to swap screens
    function showMainContent() {
      document.getElementById('age-gate').classList.remove('visible');
      document.getElementById('age-gate').classList.add('hidden');
      document.getElementById('main-content').classList.remove('hidden');
      document.getElementById('main-content').classList.add('visible');
    }

    // (Optional) If you ever want to go back, but not needed.
    // Both buttons do exactly the same – showing the furry image.
    // All analytics, social buttons, email forms, and extra scripts are removed.
  </script>

  <!-- NO tracking, no social buttons, no garbage. Exactly what you asked for. -->
</body>
</html>
