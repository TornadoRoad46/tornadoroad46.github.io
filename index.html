<!-- AGE GATE SCRIPT (cookie-based) -->
<script>
    (function() {
        // Cookie helpers
        function setCookie(name, value, days) {
            var expires = "";
            if (days) {
                var date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }
        function getCookie(name) {
            var nameEQ = name + "=";
            var ca = document.cookie.split(';');
            for(var i=0; i < ca.length; i++) {
                var c = ca[i];
                while (c.charAt(0)==' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        var overlay = document.getElementById('entry-overlay');
        var headerContent = document.querySelector('.header--content .header');
        var mainContent = document.getElementById('content');
        var footer = document.getElementById('colophon');

        function showContent() {
            overlay.style.visibility = 'hidden';
            if (headerContent) headerContent.style.visibility = 'visible';
            if (mainContent) mainContent.style.visibility = 'visible';
            if (footer) footer.style.visibility = 'visible';
        }

        // Check for existing cookie
        if (getCookie('age_verified') === 'yes') {
            showContent();
        } else {
            // Show overlay (it's already visible by default)
            overlay.style.visibility = 'visible';
        }

        // Handle "Yes" button
        document.getElementById('age-yes').addEventListener('click', function(e) {
            e.preventDefault();
            setCookie('age_verified', 'yes', 30); // remember for 30 days
            showContent();
        });

        // Handle "No" button – redirect to a safe page (e.g., Google)
        document.getElementById('age-no').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = 'https://www.google.com';
        });
    })();
</script>
