<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cars Vs Trains</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #000;
    color: #fff;
}

#ageGate, #mainContent, #noAccess {
    display: none;
}

.centered {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
}

button {
    padding: 12px 25px;
    margin: 10px;
    font-size: 16px;
    cursor: pointer;
}

.video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 15px;
    padding: 20px;
}

.video-grid iframe {
    width: 100%;
    height: 200px;
}

footer {
    text-align: center;
    font-size: 10px;
    opacity: 0.4;
    padding: 10px;
}
</style>
</head>

<body>

<!-- AGE GATE -->
<div id="ageGate" class="centered">
    <img src="CvT-header-transparent.png" style="max-width:400px;">
    <h1>ARE YOU AT LEAST 18 YEARS OF AGE?</h1>
    <div>
        <button onclick="enterSite()">Yes, I Am</button>
        <button onclick="denyAccess()">No, I'm Not</button>
    </div>
    <p style="margin-top:20px;">
        <strong>NOTICE:</strong><br>
        The following are real videos.<br>
        You don’t ever want to get hit by a train.
    </p>
</div>

<!-- NO ACCESS SCREEN (YOUR CUSTOM CONTENT) -->
<div id="noAccess" class="centered">
    <h1>Access Denied</h1>
    <p>This content is restricted.</p>
    <!-- Replace above with whatever you want -->
</div>

<!-- MAIN SITE -->
<div id="mainContent">
    <header style="text-align:center; padding:20px;">
        <img src="CvT-header-transparent.png" style="max-width:400px;">
    </header>

    <div class="video-grid">
        <!-- ORIGINAL VIDEO IDS -->
        <iframe src="https://www.youtube.com/embed/iEA1rLpbedU" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/frP4kb616G4" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/fZ8GdGLm_qw" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/biu8U4MUGWE" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/T8BdcFa4x80" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/BGXHTrFNwYo" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/XoaOz6FsVPk" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/0sxg-lYABXo" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/_c28oIaGUkA" allowfullscreen></iframe>
    </div>

    <footer>
        Re-created archival version of the original CarsVsTrains site. No affiliation with original owners.
    </footer>
</div>

<!-- HIDDEN VISITOR COUNTER -->
<img src="https://api.visitorbadge.io/api/visitors?path=carsvstrains.com&countColor=%23263759"
     style="display:none;">

<script>
function enterSite() {
    document.getElementById("ageGate").style.display = "none";
    document.getElementById("mainContent").style.display = "block";
}

function denyAccess() {
    document.getElementById("ageGate").style.display = "none";
    document.getElementById("noAccess").style.display = "flex";
}

window.onload = function() {
    document.getElementById("ageGate").style.display = "flex";
};
</script>

</body>
</html>
