    <!-- Enhanced glassy look for video page -->
    <style>
        /* Video wrapper with 16:9 aspect ratio and glassy effect */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            background: rgba(255,255,255,0.05); /* light glass base */
            margin: 12px; /* even gap in all directions */
            box-sizing: border-box;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .video-wrapper:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 25px rgba(255,255,255,0.15);
            border-color: rgba(255,204,0,0.5);
        }

        /* Compensate for margin on pure-g to keep outer edges aligned */
        .pure-g {
            margin: -12px; /* pulls back the outer margin so edges align */
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 15px; /* slightly smaller than wrapper to show border */
        }

        /* Footer fixed at bottom with original yellow */
        #colophon {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #ffcc00; /* cars-vs-trains yellow */
            color: #000;
            text-align: center;
            padding: 12px 0;
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 16px;
            z-index: 1000;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.2);
        }
        /* Ensure content doesn't hide behind footer */
        body {
            margin-bottom: 60px; /* match footer height */
        }
        /* Hidden visitor badge */
        .visitor-badge-hidden {
            display: none;
        }

        /* Fullscreen image for "No" button - covers entire viewport exactly */
        #fullscreen-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black url('https://static1.e926.net/data/84/13/8413d473460f12aca578733224732579.jpg') no-repeat center center;
            background-size: cover;
            z-index: 10000;
            display: none;
        }

        /* Age overlay glassy look (optional) */
        #entry-overlay {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
        }
        .entry--wrapper .header {
            background: rgba(30,30,30,0.8);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,204,0,0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
    </style>

<body>
    <!-- Fullscreen image for "No" button -->
    <div id="fullscreen-image" onclick="this.style.display='none'; document.getElementById('entry-overlay').style.visibility='visible';"></div>

    <div id="page" class="site">
        <!-- Age overlay (always visible initially) -->
        <div id="entry-overlay" style="visibility: visible;">
            <div class="entry--wrapper">
                <header class="header">
                    <img class="title" src="/CvT-header-transparent.png" alt="[Cars vs Trains]">
                    <h1>ARE YOU AT LEAST 18 YEARS OF AGE?</h1>
                    <div class="age--buttons__wrap">
                        <a href="javascript:void(0);" onclick="verifyAge(); return false;">Yes, I Am</a>
                        <a href="javascript:void(0);" onclick="showFullscreenImage(); return false;">No, I'm Not</a>
                    </div>
                    <hr>
                    <p class="age--notice">
                        <span class="notice--yellow">NOTICE:</span> The following are real videos.<br>
                        You don’t ever want to get hit by a train.
                    </p>
                </header>
                <!-- bottom div kept but empty (social icons removed) -->
                <div class="bottom"></div>
            </div>
        </div>

        <!-- Header after verification (hidden initially) – social icons removed -->
        <div class="header--content">
            <header class="header" style="visibility: hidden;">
                <img class="title" src="/CvT-header-transparent.png" alt="[Cars vs Trains]">
                <!-- No icons -->
            </header>
        </div>

        <!-- Main video grid – YouTube embeds with glassy look -->
        <div id="content" class="site-content" style="visibility: hidden;">
            <div id="primary" class="content-area">
                <main id="main" class="site-main" role="main">
                    <div class="pure-g">
                        <!-- Video 1 -->
                        <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3">
                            <div class="l-box video-wrapper">
                                <iframe src="https://www.youtube.com/embed/iEA1rLpbedU" allowfullscreen></iframe>
                            </div>
                        </div>
                        <!-- Video 2 -->
                        <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3">
                            <div class="l-box video-wrapper">
                                <iframe src="https://www.youtube.com/embed/frP4kb616G4" allowfullscreen></iframe>
                            </div>
                        </div>
                        <!-- Video 3 -->
                        <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3">
                            <div class="l-box video-wrapper">
                                <iframe src="https://www.youtube.com/embed/fZ8GdGLm_qw" allowfullscreen></iframe>
                            </div>
                        </div>
                        <!-- Video 4 -->
                        <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3">
                            <div class="l-box video-wrapper">
                                <iframe src="https://www.youtube.com/embed/biu8U4MUGWE" allowfullscreen></iframe>
                            </div>
                        </div>
                        <!-- Video 5 -->
                        <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3">
                            <div class="l-box video-wrapper">
                                <iframe src="https://www.youtube.com/embed/T8BdcFa4x80" allowfullscreen></iframe>
                            </div>
                        </div>
                        <!-- Video 6 -->
                        <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3">
                            <div class="l-box video-wrapper">
                                <iframe src="https://www.youtube.com/embed/BGXHTrFNwYo" allowfullscreen></iframe>
                            </div>
                        </div>
                        <!-- Video 7 -->
                        <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3">
                            <div class="l-box video-wrapper">
                                <iframe src="https://www.youtube.com/embed/XoaOz6FsVPk" allowfullscreen></iframe>
                            </div>
                        </div>
                        <!-- Video 8 -->
                        <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3">
                            <div class="l-box video-wrapper">
                                <iframe src="https://www.youtube.com/embed/0sxg-lYABXo" allowfullscreen></iframe>
                            </div>
                        </div>
                        <!-- Video 9 -->
                        <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3">
                            <div class="l-box video-wrapper">
                                <iframe src="https://www.youtube.com/embed/_c28oIaGUkA" allowfullscreen></iframe>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Footer fixed at bottom with yellow background and hidden visitor badge -->
        <footer id="colophon" class="site-footer" role="contentinfo" style="visibility: hidden;">
            <div style="text-align:center;">
                Website recreation
                <!-- Hidden visitor badge (counts visits) -->
                <img src="https://api.visitorbadge.io/api/visitors?path=carsvstrains.com&countColor=%23263759" style="display:none;" alt="visitor counter" />
            </div>
        </footer>
    </div>

    <!-- Age verification and fullscreen image script -->
    <script>
        function showContent() {
            document.getElementById('entry-overlay').style.visibility = 'hidden';
            document.querySelector('.header--content .header').style.visibility = 'visible';
            document.getElementById('content').style.visibility = 'visible';
            document.getElementById('colophon').style.visibility = 'visible';
        }

        function verifyAge() {
            showContent();
        }

        function showFullscreenImage() {
            document.getElementById('entry-overlay').style.visibility = 'hidden';
            document.getElementById('fullscreen-image').style.display = 'block';
            document.querySelector('.header--content .header').style.visibility = 'hidden';
            document.getElementById('content').style.visibility = 'hidden';
            document.getElementById('colophon').style.visibility = 'hidden';
        }

        (function() {
            document.getElementById('entry-overlay').style.visibility = 'visible';
            document.querySelector('.header--content .header').style.visibility = 'hidden';
            document.getElementById('content').style.visibility = 'hidden';
            document.getElementById('colophon').style.visibility = 'hidden';
            document.getElementById('fullscreen-image').style.display = 'none';
        })();

        document.getElementById('fullscreen-image').onclick = function() {
            this.style.display = 'none';
            document.getElementById('entry-overlay').style.visibility = 'visible';
        };
    </script>

    <!-- wp-embed (optional) -->
    <script type="text/javascript" src="https://web.archive.org/web/20181227184606/http://www.carsvstrains.com/wp-includes/js/wp-embed.min.js?ver=4.9.6"></script>
