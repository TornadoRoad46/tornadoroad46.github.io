<script>
    (function($) {
        $(document).ready(function() {
            // Age verification buttons
            $('#yes-button').on('click', function(e) {

                $('#entry-overlay').hide();
                $('#main-content').css('visibility', 'visible');
                $('#no-content').hide();
            });

            $('#no-button').on('click', function(e) {

                $('#entry-overlay').hide();
                $('#main-content').css('visibility', 'hidden');
                $('#no-content').show();
            });
