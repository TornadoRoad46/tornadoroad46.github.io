<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cars Vs Trains</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #000;
    color: #fff;
    text-align: center;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
}

.box {
    max-width: 600px;
    padding: 40px;
}

h1 {
    margin-bottom: 20px;
}

.buttons a {
    display: inline-block;
    margin: 15px;
    padding: 15px 30px;
    text-decoration: none;
    font-weight: bold;
    border-radius: 4px;
}

.yes {
    background: #d62828;
    color: #fff;
}

.no {
    background: #555;
    color: #fff;
}

.notice {
    margin-top: 25px;
    font-size: 14px;
    color: #f4d35e;
}

.content {
    display: none;
    padding: 40px;
}

.video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
}
iframe {
    width: 100%;
    height: 200px;
}
</style>
</head>

<body>

<div class="overlay" id="ageGate">
    <div class="box">
        <h1>ARE YOU AT LEAST 18 YEARS OF AGE?</h1>

        <div class="buttons">
            <a href="#" class="yes" onclick="enterSite()">Yes, I Am</a>
            <a href="https://static1.e926.net/data/84/13/8413d473460f12aca578733224732579.jpg" class="no">No, I'm Not</a>
        </div>

        <div class="notice">
            NOTICE: The following are real videos.<br>
            You don’t ever want to get hit by a train.
        </div>
    </div>
</div>

<div class="content" id="mainContent">
    <h2>Cars Vs Trains</h2>

    <div class="video-grid">
        <iframe src="https://www.youtube.com/embed/iEA1rLpbedU" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/frP4kb616G4" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/fZ8GdGLm_qw" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/biu8U4MUGWE" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/T8BdcFa4x80" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/BGXHTrFNwYo" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/XoaOz6FsVPk" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/0sxg-lYABXo" allowfullscreen></iframe>
        <iframe src="https://www.youtube.com/embed/_c28oIaGUkA" allowfullscreen></iframe>
    </div>
</div>

<script>
function enterSite() {
    document.getElementById("ageGate").style.display = "none";
    document.getElementById("mainContent").style.display = "block";
}
</script>

</body>
</html>
