<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cars Vs Trains</title>

<!-- CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pure/0.6.0/pure-min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pure/0.6.0/grids-responsive-min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
/* Simple styling based on original site */
body { font-family: Arial, sans-serif; margin:0; background:#fff; }
header.header { text-align:center; padding:20px; background:#222; color:#fff; }
header.header img.title { max-width:400px; margin-bottom:15px; }
.age--buttons__wrap a { display:inline-block; margin:5px; padding:10px 15px; background:#f2f2f2; color:#000; text-decoration:none; }
.video-wrapper { position:relative; margin:15px; cursor:pointer; }
.video-wrapper img.video--thumbnail { width:100%; display:block; }
.video-wrapper .vid-icon { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); }
.video-wrapper .vid-icon img { width:80px; height:80px; }
.video-wrapper .share-icon { position:absolute; top:10px; right:10px; }
.pure-g { display:flex; flex-wrap:wrap; justify-content:center; }
.pure-u-1 { width:100%; max-width:300px; margin:5px; }
</style>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- YouTube PopUp plugin -->
<script>
/*
Simple YouTube popup replacement
Click thumbnail, open YouTube in modal
*/
$(document).ready(function(){
  $('.youtube').click(function(e){
    e.preventDefault();
    var videoId = $(this).attr('youtube');
    var iframe = '<div id="yt-modal" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:1000;"><iframe width="80%" height="80%" src="https://www.youtube.com/embed/'+videoId+'?autoplay=1" frameborder="0" allowfullscreen></iframe><span id="yt-close" style="position:absolute;top:20px;right:30px;font-size:30px;color:#fff;cursor:pointer;">&times;</span></div>';
    $('body').append(iframe);
    $('#yt-close').click(function(){ $('#yt-modal').remove(); });
  });
});
</script>

</head>
<body>

<header class="header">
  <img class="title" src="https://i.imgur.com/2xOEzXG.png" alt="[Cars vs Trains]">
  <h1>ARE YOU AT LEAST 18 YEARS OF AGE?</h1>
  <div class="age--buttons__wrap">
    <a href="#yes">Yes, I Am</a>
    <a href="#no">No, I'm Not</a>
  </div>
  <hr>
  <p class="age--notice"><span class="notice--yellow">NOTICE:</span> The following are real videos.<br> You don’t ever want to get hit by a train.</p>
</header>

<main class="pure-g">

  <!-- Example video block -->
  <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3">
    <div class="video-wrapper">
      <img src="https://img.youtube.com/vi/iEA1rLpbedU/maxresdefault.jpg" class="video--thumbnail">
      <span class="vid-icon">
        <a href="#" youtube="iEA1rLpbedU" class="youtube">
          <img src="https://i.imgur.com/OgkYMjI.png" width="80" height="80" alt="Play">
        </a>
      </span>
    </div>
  </div>

  <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3">
    <div class="video-wrapper">
      <img src="https://img.youtube.com/vi/frP4kb616G4/maxresdefault.jpg" class="video--thumbnail">
      <span class="vid-icon">
        <a href="#" youtube="frP4kb616G4" class="youtube">
          <img src="https://i.imgur.com/OgkYMjI.png" width="80" height="80" alt="Play">
        </a>
      </span>
    </div>
  </div>

  <div class="pure-u-1 pure-u-md-1-2 pure-u-lg-1-3">
    <div class="video-wrapper">
      <img src="https://img.youtube.com/vi/fZ8GdGLm_qw/maxresdefault.jpg" class="video--thumbnail">
      <span class="vid-icon">
        <a href="#" youtube="fZ8GdGLm_qw" class="youtube">
          <img src="https://i.imgur.com/OgkYMjI.png" width="80" height="80" alt="Play">
        </a>
      </span>
    </div>
  </div>

  <!-- Add other video blocks similarly... -->

</main>

<footer style="text-align:center; padding:20px; background:#222; color:#fff;">
  &copy; 2026 Cars Vs Trains
</footer>

</body>
</html>
