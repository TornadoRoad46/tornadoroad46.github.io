<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cars Vs Trains</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css">

<style>
body {
    margin:0;
    font-family: 'Roboto', sans-serif;
    background:#000;
    color:#fff;
}

#entry-overlay {
    position:fixed;
    width:100%;
    height:100%;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.entry--wrapper {
    max-width:700px;
}

.title {
    max-width:500px;
    width:100%;
    margin-bottom:30px;
}

h1 {
    font-size:28px;
    margin-bottom:30px;
}

.age--buttons__wrap a {
    display:inline-block;
    margin:10px 20px;
    padding:15px 30px;
    text-decoration:none;
    font-weight:bold;
    background:#c40000;
    color:#fff;
    border-radius:4px;
    transition:0.2s ease;
}

.age--buttons__wrap a:last-child {
    background:#444;
}

.age--buttons__wrap a:hover {
    opacity:0.8;
}

hr {
    margin:40px 0;
    border:0;
    border-top:1px solid #333;
}

.age--notice {
    font-size:14px;
    line-height:1.6;
}

.notice--yellow {
    color:#f3d20b;
    font-weight:bold;
}
</style>

</head>
<body>

<div id="entry-overlay">
    <div class="entry--wrapper">
        <header class="header">
            <img class="title" src="images/CvT-header-transparent.png" alt="Cars vs Trains">

            <h1>ARE YOU AT LEAST 18 YEARS OF AGE?</h1>

            <div class="age--buttons__wrap">
                <a href="age-check.html">Yes, I Am</a>
                <a href="furry.html">No, I'm Not</a>
            </div>

            <hr>

            <p class="age--notice">
                <span class="notice--yellow">NOTICE:</span>
                The following are real videos.<br>
                You don’t ever want to get hit by a train.
            </p>
        </header>
    </div>
</div>

</body>
</html>
