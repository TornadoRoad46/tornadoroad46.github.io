<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cars Vs Trains — Age Check</title>
  <style>
    :root{
      --bg:#0b0b0b;
      --accent:#f4f4f4;
      --muted:#e6b800; /* yellow notice */
      --btn-bg:#333;
      --btn-border:#666;
      --btn-radius:6px;
      --max-width:980px;
      --page-pad:24px;
      font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    html,body{height:100%;margin:0;}
    body{
      background: var(--bg);
      color:var(--accent);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:var(--page-pad);
      box-sizing:border-box;
    }
    .card{
      width:100%;
      max-width:var(--max-width);
      background:linear-gradient(#0f0f0f,#0b0b0b);
      border-radius:10px;
      padding:28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      text-align:center;
    }
    .header-img{
      max-width:320px;
      width:60%;
      height:auto;
      display:block;
      margin:0 auto 18px;
    }
    h1{
      margin:0 0 18px;
      font-size:28px;
      letter-spacing:1px;
      text-transform:uppercase;
    }
    .age-buttons{
      display:flex;
      gap:14px;
      justify-content:center;
      margin:14px 0 12px;
      flex-wrap:wrap;
    }
    .age-buttons a{
      display:inline-block;
      padding:12px 20px;
      color:var(--accent);
      background:var(--btn-bg);
      border:1px solid var(--btn-border);
      border-radius:var(--btn-radius);
      text-decoration:none;
      font-weight:600;
      min-width:140px;
      text-align:center;
      transition:transform .08s ease, box-shadow .08s ease;
    }
    .age-buttons a:active{ transform: translateY(1px); }
    .age-notice{
      margin-top:14px;
      font-size:14px;
      color:#cfcfcf;
      line-height:1.4;
    }
    .age-notice .notice-yellow{
      color:var(--muted);
      font-weight:700;
    }

    /* iframe overlay when showing your version */
    #viewerOverlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.85);
      z-index:9999;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      box-sizing:border-box;
      visibility:hidden;
      opacity:0;
      transition:opacity .18s ease, visibility .18s;
    }
    #viewerOverlay.visible{ visibility:visible; opacity:1; }
    #viewerFrame{
      width:100%;
      max-width:1200px;
      height:88vh;
      border:0;
      border-radius:8px;
      box-shadow:0 12px 40px rgba(0,0,0,0.7);
    }
    .viewer-close{
      position:absolute;
      right:28px;
      top:20px;
      z-index:10000;
      background:#222;
      color:#fff;
      border:1px solid #333;
      padding:8px 12px;
      border-radius:6px;
      cursor:pointer;
    }

    /* small screens */
    @media (max-width:520px){
      h1{ font-size:20px; }
      .header-img{ width:72%; max-width:260px; }
      #viewerFrame{ height:86vh; }
    }
  </style>
</head>
<body>
  <div class="card" role="main" aria-labelledby="age-heading">
    <!-- Logo: uses the file you placed in the repo -->
    <img src="CvT-header-transparent.png" alt="Cars vs Trains" class="header-img" />

    <h1 id="age-heading">ARE YOU AT LEAST 18 YEARS OF AGE?</h1>

    <div class="age-buttons" aria-hidden="false">
      <!-- Both buttons intentionally load your version (per request).
           Their labels mimic the original. -->
      <a href="#" id="btn-yes" role="button">Yes, I Am</a>
      <a href="#" id="btn-no" role="button">No, I'm Not</a>
    </div>

    <hr style="border:none;border-top:1px solid #1b1b1b;margin:18px 0 6px;opacity:.6">

    <p class="age-notice">
      <span class="notice-yellow">NOTICE:</span>
      The following are real videos.<br>
      You don’t ever want to get hit by a train.
    </p>
  </div>

  <!-- overlayed iframe used to show the user's page content -->
  <div id="viewerOverlay" aria-hidden="true">
    <button class="viewer-close" id="closeViewer" aria-label="Close viewer">Close</button>
    <iframe id="viewerFrame" title="Your page preview"></iframe>
  </div>

  <script>
    // Your supplied "my version" HTML. Kept verbatim (slight tidy-up).
    const myVersionHTML = `<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>furries vs trains</title>
  <style>
    html,body{height:100%;margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px;box-sizing:border-box}
    .main-image{max-width:100%;max-height:75vh;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
    .badge{margin-top:18px}
    .badge img{border-radius:6px}
  </style>
</head>
<body>
  <div class="wrap">
    <img class="main-image" src="https://static1.e926.net/data/84/13/8413d473460f12aca578733224732579.jpg" alt="main">
    <a class="badge" href="https://visitorbadge.io/status?path=carsvstrains.com" target="_blank" rel="noopener">
      <img src="https://api.visitorbadge.io/api/visitors?path=carsvstrains.com&countColor=%23263759" alt="visitors">
    </a>
  </div>
</body>
</html>`;

    // Elements
    const btnYes = document.getElementById('btn-yes');
    const btnNo  = document.getElementById('btn-no');
    const overlay = document.getElementById('viewerOverlay');
    const iframe = document.getElementById('viewerFrame');
    const closeBtn = document.getElementById('closeViewer');

    function showMyVersion(){
      // use srcdoc to render the provided HTML inside the iframe
      iframe.srcdoc = myVersionHTML;
      overlay.classList.add('visible');
      overlay.setAttribute('aria-hidden','false');
    }

    btnYes.addEventListener('click', function(e){
      e.preventDefault();
      showMyVersion();
    });
    btnNo.addEventListener('click', function(e){
      e.preventDefault();
      showMyVersion();
    });

    closeBtn.addEventListener('click', function(){
      overlay.classList.remove('visible');
      overlay.setAttribute('aria-hidden','true');
      iframe.srcdoc = 'about:blank';
    });

    // allow click outside iframe to close (optional)
    overlay.addEventListener('click', function(e){
      if(e.target === overlay) {
        closeBtn.click();
      }
    });
  </script>
</body>
</html>
