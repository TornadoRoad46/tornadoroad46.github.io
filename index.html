<!DOCTYPE html>
<html>
<head>
  <title>Cars Vs Trains</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    #ageGate, #mainContent {
      display: none;
      flex-direction: column;
      align-items: center;
    }

    button {
      padding: 12px 24px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    img.main-image {
      max-width: 90%;
      max-height: 80vh;
    }

    .badge {
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div id="ageGate">
  <h1>ARE YOU AT LEAST 18 YEARS OF AGE?</h1>
  <div>
    <button onclick="enterSite()">Yes, I Am</button>
    <button onclick="denyAccess()">No, I'm Not</button>
  </div>
  <p>You don’t ever want to get hit by a train.</p>
</div>

<div id="mainContent">
  <img class="main-image" src="https://static1.e926.net/data/84/13/8413d473460f12aca578733224732579.jpg">

  <a class="badge" href="https://visitorbadge.io/status?path=carsvstrains.com">
    <img src="https://api.visitorbadge.io/api/visitors?path=carsvstrains.com&countColor=%23263759" />
  </a>
</div>

<script>
  function enterSite() {
    document.getElementById("ageGate").style.display = "none";
    document.getElementById("mainContent").style.display = "flex";
  }

  function denyAccess() {
    window.location.href = "https://google.com";
  }

  document.getElementById("ageGate").style.display = "flex";
</script>

</body>
</html>
