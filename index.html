<!-- JavaScript: jQuery from CDN and custom functionality -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    (function($) {
        // Cookie helpers
        function setCookie(name, value, days) {
            var expires = "";
            if (days) {
                var date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }
        function getCookie(name) {
            var nameEQ = name + "=";
            var ca = document.cookie.split(';');
            for (var i = 0; i < ca.length; i++) {
                var c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        // Age gate control
        var $overlay = $('#entry-overlay');
        var $headerContent = $('.header--content .header, #content, #colophon');

        function hideOverlay() {
            $overlay.fadeOut();
            $headerContent.css('visibility', 'visible');
        }

        // Check if already verified
        if (getCookie('cvt_age_verified') === 'yes') {
            hideOverlay();
        }

        // Yes button: set cookie and hide overlay
        $('#age-yes').on('click', function(e) {
            e.preventDefault();
            setCookie('cvt_age_verified', 'yes', 365); // valid for one year
            hideOverlay();
        });

        // No button: redirect (already linked to Google, but prevent default if needed)
        $('#age-no').on('click', function(e) {
            // optional: ask for confirmation
            if (!confirm('You must be 18 or older to view this content. Leave now?')) {
                e.preventDefault();
            }
        });

        // Video play buttons: open YouTube video in new tab
        $('.youtube-play').on('click', function(e) {
            e.preventDefault();
            var videoId = $(this).attr('youtube');
            if (videoId) {
                window.open('https://www.youtube.com/watch?v=' + videoId, '_blank');
            }
        });

        // Optional: handle share icons (open share popup or just link)
        $('.share-icon').on('click', function() {
            alert('Share functionality coming soon!');
        });

        // If you have the original email form, you may need to adapt it.
        // The current form does nothing on submit.
        $('.wpcf7-form').on('submit', function(e) {
            e.preventDefault();
            alert('Email subscription not yet implemented.');
        });

    })(jQuery);
</script>
