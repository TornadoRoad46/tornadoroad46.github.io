<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cars Vs Trains</title>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
}

header {
    padding: 30px 20px;
}

.logo {
    max-width: 500px;
    width: 90%;
}

.age-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.age-box {
    max-width: 500px;
    padding: 30px;
}

button {
    padding: 12px 25px;
    margin: 10px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    border-radius: 4px;
}

.btn-yes {
    background: #e50914;
    color: #fff;
}

.btn-no {
    background: #444;
    color: #fff;
}

.notice {
    margin-top: 15px;
    font-size: 14px;
    color: #ccc;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    padding: 20px;
    max-width: 1200px;
    margin: auto;
}

.video iframe {
    width: 100%;
    height: 315px;
    border: none;
}

footer {
    padding: 30px;
    font-size: 14px;
    color: #777;
}
</style>
</head>

<body>

<div class="age-overlay" id="ageGate">
    <div class="age-box">
        <img src="CvT-header-transparent.png" class="logo" alt="Cars Vs Trains">
        <h2>ARE YOU AT LEAST 18 YEARS OF AGE?</h2>
        <button class="btn-yes" onclick="acceptAge()">Yes, I Am</button>
        <button class="btn-no" onclick="denyAge()">No, I'm Not</button>
        <p class="notice">
            The following are real videos.<br>
            You don’t ever want to get hit by a train.
        </p>
    </div>
</div>

<header>
    <img src="CvT-header-transparent.png" class="logo" alt="Cars Vs Trains">
</header>

<main class="grid">
    <div class="video"><iframe src="https://www.youtube.com/embed/iEA1rLpbedU" allowfullscreen></iframe></div>
    <div class="video"><iframe src="https://www.youtube.com/embed/frP4kb616G4" allowfullscreen></iframe></div>
    <div class="video"><iframe src="https://www.youtube.com/embed/fZ8GdGLm_qw" allowfullscreen></iframe></div>
    <div class="video"><iframe src="https://www.youtube.com/embed/biu8U4MUGWE" allowfullscreen></iframe></div>
    <div class="video"><iframe src="https://www.youtube.com/embed/T8BdcFa4x80" allowfullscreen></iframe></div>
    <div class="video"><iframe src="https://www.youtube.com/embed/BGXHTrFNwYo" allowfullscreen></iframe></div>
    <div class="video"><iframe src="https://www.youtube.com/embed/XoaOz6FsVPk" allowfullscreen></iframe></div>
    <div class="video"><iframe src="https://www.youtube.com/embed/0sxg-lYABXo" allowfullscreen></iframe></div>
    <div class="video"><iframe src="https://www.youtube.com/embed/_c28oIaGUkA" allowfullscreen></iframe></div>
</main>

<footer>
    © 2026 CarsVsTrains.com — Stay Safe Around Railroad Crossings
</footer>

<script>
function acceptAge() {
    localStorage.setItem("ageVerified", "true");
    document.getElementById("ageGate").style.display = "none";
}

function denyAge() {
    window.location.href = "https://www.google.com";
}

window.onload = function() {
    if (localStorage.getItem("ageVerified") === "true") {
        document.getElementById("ageGate").style.display = "none";
    }
}
</script>

</body>
</html>
