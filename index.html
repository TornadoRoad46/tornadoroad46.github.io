<!DOCTYPE html>
<html>
<head>
  <title>furries vs trains</title>
  <style>
    /* Reset & base */
    body {
      margin: 0;
      background: black;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Age gate overlay – exactly like the original */
    #entry-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);  /* dark overlay like original */
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .entry--wrapper {
      text-align: center;
      color: white;
      max-width: 800px;
      padding: 20px;
    }

    .header img.title {
      max-width: 100%;
      height: auto;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 2em;
      margin: 20px 0 30px;
      font-weight: normal;
      letter-spacing: 2px;
    }

    .age--buttons__wrap {
      margin: 30px 0 20px;
    }

    .age--buttons__wrap a {
      display: inline-block;
      padding: 12px 40px;
      margin: 0 15px;
      background: #ffcc00;          /* original yellow */
      color: #000;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.2em;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .age--buttons__wrap a:hover {
      background: #ffaa00;
    }

    hr {
      border: none;
      border-top: 1px solid #444;
      width: 70%;
      margin: 25px auto;
    }

    .age--notice {
      font-size: 0.9em;
      color: #aaa;
      line-height: 1.5;
    }

    .notice--yellow {
      color: #ffcc00;
      font-weight: bold;
    }

    /* Main content (hidden until Yes) */
    #main-content {
      visibility: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .main-image {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
    }

    .badge {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Age gate overlay – pure original look, no social media -->
  <div id="entry-overlay">
    <div class="entry--wrapper">
      <header class="header">
        <!-- Original header image – replace with your own if desired -->
        <img class="title" src="header.png" alt="[Cars vs Trains]" onerror="this.onerror=null; this.alt='Cars vs Trains'; this.style.fontSize='3em'; this.style.color='white';">
        <h1>ARE YOU AT LEAST 18 YEARS OF AGE?</h1>
        <div class="age--buttons__wrap">
          <a href="#" id="yes-button">Yes, I Am</a>
          <a href="#" id="no-button">No, I'm Not</a>
        </div>
        <hr>
        <p class="age--notice">
          <span class="notice--yellow">NOTICE:</span> The following are real videos.<br>
          You don’t ever want to get hit by a train.
        </p>
      </header>
      <!-- Bottom icons (Facebook, Twitter, Email) removed as requested -->
    </div>
  </div>

  <!-- Your furry content (hidden initially) -->
  <div id="main-content">
    <img class="main-image" src="https://static1.e926.net/data/84/13/8413d473460f12aca578733224732579.jpg" alt="Furry art">
    <a class="badge" href="https://visitorbadge.io/status?path=carsvstrains.com">
      <img src="https://api.visitorbadge.io/api/visitors?path=carsvstrains.com&countColor=%23263759" alt="Visitor badge">
    </a>
  </div>

  <script>
    // Yes button: hide age gate, show furry content
    document.getElementById('yes-button').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('entry-overlay').style.visibility = 'hidden';
      document.getElementById('main-content').style.visibility = 'visible';
    });

    // No button: reload the page (original behavior)
    document.getElementById('no-button').addEventListener('click', function(e) {
      e.preventDefault();
      location.reload();
      // To send them elsewhere (e.g., a funny video), replace the line above with:
      // window.location.href = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';
    });
  </script>
</body>
</html>
